<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Phantom — Solana AI Trader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(145deg, #0a0a12 0%, #12122a 50%, #0d1a2d 100%);
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; background: linear-gradient(90deg, #a78bfa, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #9898b0; font-size: 0.9rem; line-height: 1.5; margin-bottom: 24px; }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .phantom-btn {
      background: linear-gradient(135deg, #ab9ff2, #7c6ee0);
      color: #fff;
      box-shadow: 0 8px 24px rgba(124,110,224,0.35);
    }
    .phantom-btn:hover { transform: translateY(-2px); }
    .phantom-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status { margin-top: 16px; font-size: 0.85rem; color: #22d3ee; min-height: 20px; }
    .addr { margin-top: 12px; font-size: 0.75rem; color: #666; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">👻</div>
    <h1>Connect Phantom Wallet</h1>
    <p>Link your Phantom wallet to the Solana AI Meme Coin Trader bot. View balance and track trades.</p>
    <button class="phantom-btn" id="connectBtn" onclick="connectPhantom()">Connect Phantom</button>
    <div class="status" id="status"></div>
    <div class="addr" id="addr"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function getProvider() {
      if ('phantom' in window) {
        const provider = window.phantom?.solana;
        if (provider?.isPhantom) return provider;
      }
      window.open('https://phantom.app/', '_blank');
      return null;
    }

    async function connectPhantom() {
      const btn = document.getElementById('connectBtn');
      const status = document.getElementById('status');
      const addr = document.getElementById('addr');
      btn.disabled = true;
      status.textContent = 'Connecting...';

      try {
        const provider = getProvider();
        if (!provider) {
          status.textContent = 'Install Phantom wallet first';
          btn.disabled = false;
          return;
        }
        const resp = await provider.connect();
        const publicKey = resp.publicKey.toString();
        addr.textContent = publicKey;
        status.textContent = 'Connected! Sending to bot...';

        tg.sendData(JSON.stringify({ publicKey }));
        status.textContent = '✅ Connected! Close this window.';
      } catch (e) {
        status.textContent = 'Error: ' + (e.message || e);
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
